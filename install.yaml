# Details about the install.yaml file are at https://ddev.readthedocs.io/en/latest/users/extend/additional-services/#sections-and-features-of-ddev-get-add-on-installyaml

name: hugo

# `ddev hugo` relies on ExecRaw, and the Hugo server ports are routed from
# config.hugo.yaml rather than a docker-compose file.
ddev_version_constraint: '>= v1.24.10'

# list of files and directories listed that are copied into project .ddev directory
# Each file should contain #ddev-generated so it can be replaced by a later `ddev get`
# if it hasn't been modified by the user.
project_files:
- config.hugo.yaml
- web-build/Dockerfile.ddev-hugo
# Custom commands must be listed as individual files, not directories.
- commands/web/hugo

post_install_actions:
- |
  #ddev-description:Drop the superseded docker-compose.hugo.yaml
  # Port routing moved to config.hugo.yaml. Earlier versions of the add-on
  # installed this file, and a leftover copy would still set HTTP_EXPOSE.
  if [ -f docker-compose.hugo.yaml ] && grep -q '#ddev-generated' docker-compose.hugo.yaml; then
    rm -f docker-compose.hugo.yaml
  fi
