name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

  schedule:
  - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This is required for "gautamkrishnar/keepalive-workflow", see "ddev/github-action-add-on-test"
permissions:
  actions: write

jobs:
  tests:
    strategy:
      matrix:
        # Hugo is installed from an official release binary, so the arm64
        # runner exercises a different artifact than the x86_64 one.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        ddev_version: [stable, HEAD]
        # Run each bats test as its own job so a failure names the test that
        # broke. Passing test_command explicitly also overrides the action's
        # default "--filter-tags !release", which would otherwise skip the
        # release test on pushes and pull requests.
        test:
          - name: directory
            command: bats tests --filter-tags !release
          - name: release
            command: bats tests --filter-tags release
      fail-fast: false

    name: ${{ matrix.test.name }} (${{ matrix.ddev_version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          test_command: ${{ matrix.test.command }}
